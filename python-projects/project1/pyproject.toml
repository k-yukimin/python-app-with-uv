[project]
name = "project1"
version = "0.1.0"
description = "First Python project scaffold managed by uv"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[project.scripts]
project1 = "project1.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project1"]

[tool.mypy]
cache_dir = "/tmp/mypy-cache"
mypy_path = ["src"]
strict = true

[tool.pytest.ini_options]
addopts = "-q"
cache_dir = "/tmp/pytest-cache"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
cache-dir = "/tmp/ruff-cache"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
